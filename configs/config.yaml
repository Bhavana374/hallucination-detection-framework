# Global System Configuration
project:
  name: "Evidence-Grounded Hybrid Transformer Framework for Hallucination Detection"
  short_name: "hallucination-detection-framework"
  version: "0.1.0"
  description: "Research-grade framework for detecting factual hallucinations in Generative AI outputs"
  author: "Lead ML Engineer & Research Team"
  random_seed: 42

paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  embeddings_dir: "data/embeddings"
  models_dir: "models"
  pretrained_models_dir: "models/pretrained"
  checkpoints_dir: "models/checkpoints"
  classifiers_dir: "models/classifiers"
  final_models_dir: "models/final"
  experiments_dir: "experiments"
  results_dir: "results"
  raw_results_dir: "results/raw"
  metrics_dir: "results/metrics"
  tables_dir: "results/tables"
  figures_dir: "results/figures"
  model_comparison_dir: "results/model_comparison"
  logs_dir: "results/raw"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_file: "results/raw/framework.log"
  console_output: true

system:
  device: "auto"  # 'auto', 'cuda', 'cpu', or 'mps'
  num_workers: 4
  deterministic: true
